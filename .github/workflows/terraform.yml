name: Terraform Platform CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop, staging]

env:
  TF_VERSION: "1.7.5"
  WORKING_DIR: "."
  TF_VAR_postgres_password: "dummy"
  TF_VAR_grafana_password: "dummy"
  TF_VAR_postgres_user: "appuser"
  TF_VAR_postgres_db: "appdb"

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for hardcoded secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

      - name: tfsec security scan
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working-directory: ${{ env.WORKING_DIR }}
          soft_fail: true

      - name: Checkov infrastructure scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ env.WORKING_DIR }}
          framework: terraform
          soft_fail: true
          skip_check: CKV_K8S_8,CKV_K8S_9,CKV_K8S_28,CKV_K8S_30,CKV_K8S_29,CKV_K8S_10,CKV_K8S_43,CKV_K8S_15,CKV_K8S_12,CKV_K8S_11,CKV_K8S_13,CKV_K8S_35

  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Init
        run: terraform init -backend=false -input=false
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ env.WORKING_DIR }}

  cost-estimate:
    name: Cost Estimate
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost cost estimate
        run: |
          infracost breakdown --path . \
            --format json \
            --out-file /tmp/infracost.json

      - name: Post cost estimate to PR
        uses: infracost/actions/comment@v3
        if: github.event_name == 'pull_request'
        with:
          path: /tmp/infracost.json
          behavior: update

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -backend=false -input=false
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color
        working-directory: ${{ env.WORKING_DIR }}
        continue-on-error: true

      - name: Post plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const output = `#### Terraform Plan 📖
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            *Pushed by: @${{ github.actor }}*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })